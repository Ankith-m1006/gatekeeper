<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1024px;height:1024px;background:#fff}
  .bg{width:1024px;height:1024px;background:radial-gradient(circle at 30% 20%,#ffffff 0%,#f3f7f4 45%,#e6f2ec 100%);display:grid;place-items:center}
</style></head>
<body><div class="bg">
<svg width="760" height="760" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#065f46" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- shield -->
  <path filter="url(#s)" d="M100 18 L162 40 C162 104 140 148 100 178 C60 148 38 104 38 40 Z" fill="url(#g)"/>
  <path d="M100 31 L151 49 C150 102 132 139 100 163 C68 139 50 102 49 49 Z" fill="#ffffff"/>
  <!-- gate arch with bars -->
  <path d="M72 128 L72 92 A28 28 0 0 1 128 92 L128 128" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#10b981" stroke-width="5" stroke-linecap="round">
    <line x1="86" y1="82" x2="86" y2="128"/><line x1="114" y1="82" x2="114" y2="128"/>
  </g>
  <line x1="66" y1="130" x2="134" y2="130" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <!-- keyhole in the middle of the gate -->
  <circle cx="100" cy="104" r="8" fill="#0f766e"/>
  <path d="M96 108 L104 108 L106 124 L94 124 Z" fill="#0f766e"/>
</svg>
</div></body></html>
