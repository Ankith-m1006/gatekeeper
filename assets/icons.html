<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#fff}
  .icon{width:1024px;height:1024px;display:grid;place-items:center;position:relative;overflow:hidden}
</style></head>
<body>

<!-- 1. GHOST STOP: a hallucinated "ghost" package, stopped -->
<div class="icon" id="i1" style="background:#fff4e8">
<svg width="820" height="820" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="#ffffff" stroke="#ff6b4a" stroke-width="12"/>
  <path d="M70 140 V88 a30 30 0 0 1 60 0 V140 l-10 -9 -10 9 -10 -9 -10 9 -10 -9 z" fill="#2b2d42"/>
  <circle cx="88" cy="92" r="6" fill="#fff"/><circle cx="112" cy="92" r="6" fill="#fff"/>
  <ellipse cx="100" cy="110" rx="6" ry="4" fill="#fff"/>
  <line x1="45" y1="155" x2="155" y2="45" stroke="#ff6b4a" stroke-width="12" stroke-linecap="round"/>
</svg></div>

<!-- 2. BOOM GATE: a toll-gate barrier in front of a package -->
<div class="icon" id="i2" style="background:#fffbea">
<svg width="820" height="820" viewBox="0 0 200 200">
  <rect x="110" y="88" width="56" height="56" rx="8" fill="#f59e0b"/>
  <path d="M110 104 H166 M138 88 V104" stroke="#fff7db" stroke-width="5"/>
  <rect x="36" y="70" width="14" height="88" rx="5" fill="#1f2937"/>
  <rect x="30" y="152" width="26" height="10" rx="4" fill="#1f2937"/>
  <g transform="rotate(-12 43 80)">
    <rect x="43" y="74" width="126" height="13" rx="6.5" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
    <rect x="62" y="76" width="16" height="9" fill="#ef4444"/><rect x="94" y="76" width="16" height="9" fill="#ef4444"/><rect x="126" y="76" width="16" height="9" fill="#ef4444"/>
  </g>
  <circle cx="43" cy="80" r="9" fill="#ef4444" stroke="#1f2937" stroke-width="4"/>
</svg></div>

<!-- 3. THE WATCH: an eye whose pupil is a package (Squat Watch) -->
<div class="icon" id="i3" style="background:#eef2ff">
<svg width="820" height="820" viewBox="0 0 200 200">
  <path d="M20 100 C55 45 145 45 180 100 C145 155 55 155 20 100 Z" fill="#ffffff" stroke="#4f46e5" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="100" cy="100" r="34" fill="#4f46e5"/>
  <path d="M100 80 L118 90 V110 L100 120 L82 110 V90 Z" fill="#c7d2fe"/>
  <path d="M82 90 L100 100 L118 90 M100 100 V120" stroke="#4f46e5" stroke-width="4" fill="none" stroke-linejoin="round"/>
</svg></div>

<!-- 4. THE CREW: five agents standing guard in a ring around one package -->
<div class="icon" id="i4" style="background:#f0fdf9">
<svg width="820" height="820" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="62" fill="none" stroke="#99f6e4" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round"/>
  <g fill="#0d9488">
    <circle cx="100" cy="38" r="14"/><circle cx="159" cy="81" r="14"/><circle cx="136" cy="150" r="14"/>
    <circle cx="64" cy="150" r="14"/><circle cx="41" cy="81" r="14"/>
  </g>
  <g fill="#fff"><circle cx="96" cy="36" r="2.5"/><circle cx="104" cy="36" r="2.5"/><circle cx="155" cy="79" r="2.5"/><circle cx="163" cy="79" r="2.5"/><circle cx="132" cy="148" r="2.5"/><circle cx="140" cy="148" r="2.5"/><circle cx="60" cy="148" r="2.5"/><circle cx="68" cy="148" r="2.5"/><circle cx="37" cy="79" r="2.5"/><circle cx="45" cy="79" r="2.5"/></g>
  <path d="M100 78 L124 91 V117 L100 130 L76 117 V91 Z" fill="#fb923c"/>
  <path d="M76 91 L100 104 L124 91 M100 104 V130" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round"/>
</svg></div>

<!-- 5. BOUNCER HAND: a raised "stop" hand made of package blocks -->
<div class="icon" id="i5" style="background:#fdf2f8">
<svg width="820" height="820" viewBox="0 0 200 200">
  <g fill="#db2777">
    <rect x="58" y="52" width="18" height="62" rx="9"/><rect x="80" y="38" width="18" height="76" rx="9"/>
    <rect x="102" y="42" width="18" height="72" rx="9"/><rect x="124" y="56" width="18" height="58" rx="9"/>
    <path d="M58 100 H142 V128 C142 152 124 166 100 166 C78 166 60 152 56 132 L42 108 C38 100 48 92 56 98 Z"/>
  </g>
  <path d="M100 112 L116 121 V139 L100 148 L84 139 V121 Z" fill="#fdf2f8"/>
  <path d="M84 121 L100 130 L116 121 M100 130 V148" stroke="#db2777" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
</svg></div>

<!-- 6. G-GATE MONOGRAM: the letter G drawn as an open gate with a check -->
<div class="icon" id="i6" style="background:#f7f7f2">
<svg width="820" height="820" viewBox="0 0 200 200">
  <path d="M146 62 A58 58 0 1 0 158 108 H108" fill="none" stroke="#111827" stroke-width="22" stroke-linecap="round"/>
  <path d="M110 128 L126 144 L156 112" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div>

</body></html>
